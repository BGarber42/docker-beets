name: Container Publish

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel to publish
        type: choice
        options:
          - nightly
          - latest
          - branch
        default: nightly
      beets_ref:
        description: >
          Git ref in BGarber42/beets. Required for channel=branch.
          Optional override for nightly/latest.
        required: false
        type: string

concurrency:
  group: container-publish-${{ inputs.channel || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/bgarber42/beets
  BEETS_REPO: https://github.com/BGarber42/beets.git
  BEETS_API_REPO: BGarber42/beets

jobs:
  resolve:
    name: Resolve source and tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      channel: ${{ steps.resolve.outputs.channel }}
      beets_ref: ${{ steps.resolve.outputs.beets_ref }}
      image_version: ${{ steps.resolve.outputs.image_version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      tags: ${{ steps.resolve.outputs.tags }}
      build_date: ${{ steps.buildargs.outputs.build_date }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Resolve source ref and image tags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_REF: ${{ inputs.beets_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME,,}"
          CHANNEL="${INPUT_CHANNEL:-}"
          BEETS_REF="${INPUT_REF:-}"
          TAGS=()

          sanitize_branch() {
            local raw="$1"
            case "${raw}" in
              fix/manual-id-proposal-candidates)
                printf '%s\n' "import-proposals"
                return
                ;;
            esac
            local slug
            slug="$(printf '%s' "${raw}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
            slug="${slug:0:48}"
            slug="${slug%-}"
            if [[ -z "${slug}" ]]; then
              slug="branch"
            fi
            printf '%s\n' "${slug}"
          }

          resolve_sha() {
            local ref="$1"
            if [[ "${ref}" =~ ^[0-9a-f]{7,40}$ ]]; then
              printf '%s\n' "${ref}"
              return
            fi
            local line sha
            line="$(git ls-remote --refs "${BEETS_REPO}" "refs/heads/${ref}" "refs/tags/${ref}" | head -n1 || true)"
            sha="$(printf '%s' "${line}" | cut -f1)"
            if [[ -z "${sha}" ]]; then
              echo "Unable to resolve ref '${ref}' in ${BEETS_REPO}" >&2
              exit 1
            fi
            printf '%s\n' "${sha}"
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            CHANNEL="pr"
            BEETS_REF="${BEETS_REF:-master}"
          elif [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "push" ]]; then
            CHANNEL="nightly"
            BEETS_REF="${BEETS_REF:-master}"
          elif [[ -z "${CHANNEL}" ]]; then
            CHANNEL="nightly"
            BEETS_REF="${BEETS_REF:-master}"
          fi

          case "${CHANNEL}" in
            latest)
              if [[ -z "${BEETS_REF}" ]]; then
                BEETS_REF="$(gh api "repos/${BEETS_API_REPO}/releases/latest" --jq '.tag_name')"
              fi
              VERSION="${BEETS_REF#v}"
              MAJOR_MINOR="$(printf '%s' "${VERSION}" | cut -d. -f1-2)"
              SHA="$(resolve_sha "${BEETS_REF}")"
              TAGS+=("${IMAGE}:latest")
              TAGS+=("${IMAGE}:${VERSION}")
              TAGS+=("${IMAGE}:${MAJOR_MINOR}")
              IMAGE_VERSION="${VERSION}"
              BEETS_REF="${SHA}"
              ;;
            branch)
              if [[ -z "${BEETS_REF}" ]]; then
                echo "beets_ref is required when channel=branch" >&2
                exit 1
              fi
              BRANCH_TAG="$(sanitize_branch "${BEETS_REF}")"
              SHA="$(resolve_sha "${BEETS_REF}")"
              SHORT_SHA="$(printf '%s' "${SHA}" | cut -c1-7)"
              TAGS+=("${IMAGE}:${BRANCH_TAG}")
              TAGS+=("${IMAGE}:${BRANCH_TAG}-${SHORT_SHA}")
              IMAGE_VERSION="${BRANCH_TAG}-${SHORT_SHA}"
              BEETS_REF="${SHA}"
              ;;
            pr)
              SHA="$(resolve_sha "${BEETS_REF}")"
              SHORT_SHA="$(printf '%s' "${SHA}" | cut -c1-7)"
              TAGS+=("${IMAGE}:pr-build")
              IMAGE_VERSION="pr-${SHORT_SHA}"
              BEETS_REF="${SHA}"
              ;;
            nightly)
              BEETS_REF="${BEETS_REF:-master}"
              SHA="$(resolve_sha "${BEETS_REF}")"
              SHORT_SHA="$(printf '%s' "${SHA}" | cut -c1-7)"
              TAGS+=("${IMAGE}:nightly")
              TAGS+=("${IMAGE}:nightly-${SHORT_SHA}")
              IMAGE_VERSION="nightly-${SHORT_SHA}"
              BEETS_REF="${SHA}"
              ;;
            *)
              echo "Unknown channel: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          SHORT_SHA="$(printf '%s' "${BEETS_REF}" | cut -c1-7)"
          {
            echo "image=${IMAGE}"
            echo "channel=${CHANNEL}"
            echo "beets_ref=${BEETS_REF}"
            echo "image_version=${IMAGE_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "channel=${CHANNEL}"
          echo "beets_ref=${BEETS_REF}"
          echo "Resolved tags:"
          printf '  %s\n' "${TAGS[@]}"

      - name: Docker metadata labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.resolve.outputs.image }}
          labels: |
            org.opencontainers.image.title=beets
            org.opencontainers.image.description=Behavioral drop-in replacement for linuxserver/beets
            org.opencontainers.image.source=https://github.com/BGarber42/docker-beets
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Resolve build date
        id: buildargs
        shell: bash
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    steps:
      - name: Checkout docker-beets
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare smoke image name
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_SLUG="$(printf '%s' '${{ matrix.platform }}' | tr '/' '-')"
          echo "tag=beets:ci-smoke-${PLATFORM_SLUG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.resolve.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            VERSION=${{ needs.resolve.outputs.image_version }}
            VCS_REF=${{ needs.resolve.outputs.beets_ref }}
            BEETS_REPO=${{ env.BEETS_REPO }}
            BEETS_REF=${{ needs.resolve.outputs.beets_ref }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=beets-${{ matrix.cache }}
            type=registry,ref=ghcr.io/bgarber42/beets:buildcache-${{ matrix.cache }}
          cache-to: |
            type=gha,mode=max,scope=beets-${{ matrix.cache }}
            type=registry,ref=ghcr.io/bgarber42/beets:buildcache-${{ matrix.cache }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.cache }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Prepare image for smoke test
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ steps.smoke.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${{ needs.resolve.outputs.image }}@${{ steps.build.outputs.digest }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and load for PR smoke test
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.smoke.outputs.tag }}
          labels: ${{ needs.resolve.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            VERSION=${{ needs.resolve.outputs.image_version }}
            VCS_REF=${{ needs.resolve.outputs.beets_ref }}
            BEETS_REPO=${{ env.BEETS_REPO }}
            BEETS_REF=${{ needs.resolve.outputs.beets_ref }}
          cache-from: |
            type=gha,scope=beets-${{ matrix.cache }}
            type=registry,ref=ghcr.io/bgarber42/beets:buildcache-${{ matrix.cache }}
          cache-to: |
            type=gha,mode=max,scope=beets-${{ matrix.cache }}

      - name: Pull digest for smoke test
        if: github.event_name != 'pull_request'
        shell: bash
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Smoke test drop-in contract
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          WORK="$(mktemp -d)"
          mkdir -p "${WORK}/config" "${WORK}/music" "${WORK}/downloads"

          docker run --rm \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -e TZ=Etc/UTC \
            -e BEETSDIR=/tmp/beets-config \
            -e HOME=/tmp/beets-config \
            "${IMAGE}" \
            version

          cid="$(docker run -d \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -v "${WORK}/config:/config" \
            -v "${WORK}/music:/music" \
            -v "${WORK}/downloads:/downloads" \
            -p 8337:8337 \
            "${IMAGE}")"

          cleanup() {
            docker logs "${cid}" || true
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/8337) >/dev/null 2>&1; then
              echo "web UI port is ready"
              docker exec "${cid}" test -f /config/config.yaml
              docker exec "${cid}" test -x /config/beets.sh
              docker exec "${cid}" git --version >/dev/null
              docker exec -u abc "${cid}" beet version >/dev/null
              docker exec -u abc "${cid}" python -c "import gi; gi.require_version('Gst', '1.0'); from gi.repository import Gst; Gst.init(None)"
              exit 0
            fi
            sleep 2
          done

          echo "web UI did not become ready on :8337" >&2
          exit 1

      - name: Smoke test INSTALL_PIP_PACKAGES
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          WORK="$(mktemp -d)"
          mkdir -p "${WORK}/config" "${WORK}/music" "${WORK}/downloads"

          cid="$(docker run -d \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e INSTALL_PIP_PACKAGES="six" \
            -v "${WORK}/config:/config" \
            -v "${WORK}/music:/music" \
            -v "${WORK}/downloads:/downloads" \
            -p 18337:8337 \
            "${IMAGE}")"

          cleanup() {
            docker logs "${cid}" || true
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/18337) >/dev/null 2>&1; then
              docker exec -u abc "${cid}" python -c "import six; print(six.__version__)"
              exit 0
            fi
            sleep 2
          done

          echo "INSTALL_PIP_PACKAGES smoke test failed" >&2
          exit 1

  publish:
    name: Publish multi-arch image
    needs:
      - resolve
      - build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAGS: ${{ needs.resolve.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t DIGEST_FILES < <(ls -1)
          if [[ "${#DIGEST_FILES[@]}" -ne 2 ]]; then
            echo "Expected exactly 2 digests, found ${#DIGEST_FILES[@]}:" >&2
            printf '  %s\n' "${DIGEST_FILES[@]}" >&2
            exit 1
          fi

          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          SOURCE_ARGS=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCE_ARGS+=("${IMAGE}@sha256:${digest_file}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCE_ARGS[@]}"

      - name: Inspect published platforms
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY_TAG="$(printf '%s\n' "${TAGS}" | sed '/^$/d' | head -n1)"
          docker buildx imagetools inspect "${PRIMARY_TAG}"

          platforms="$(docker buildx imagetools inspect "${PRIMARY_TAG}" --raw \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | unique | sort | join(" ")')"
          echo "Published platforms: ${platforms}"
          if [[ "${platforms}" != "linux/amd64 linux/arm64" ]]; then
            echo "Expected platforms 'linux/amd64 linux/arm64', got '${platforms}'" >&2
            exit 1
          fi
