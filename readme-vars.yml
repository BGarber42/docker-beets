---
project_name: beets
project_url: "https://beets.io/"
project_logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/beets-icon.png"
project_blurb: "[{{ project_name|capitalize }}]({{ project_url }}) is a music library manager. This fork publishes a behavioral drop-in replacement for the LinuxServer image, built from BGarber42/beets."
project_lsio_github_repo_url: "https://github.com/BGarber42/docker-{{ project_name }}"
project_categories: "Music"
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "amd64-latest"}
  - {arch: "{{ arch_arm64 }}", tag: "arm64v8-latest"}
development_versions: true
development_versions_items:
  - {tag: "latest", desc: "Stable release tags from BGarber42/beets"}
  - {tag: "nightly", desc: "Built from BGarber42/beets master"}
  - {tag: "import-proposals", desc: "Alias for fix/manual-id-proposal-candidates"}
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/{{ project_name }}/config", desc: "Persistent config files"}
  - {vol_path: "/music", vol_host_path: "/path/to/music/library", desc: "Music library"}
  - {vol_path: "/downloads", vol_host_path: "/path/to/ingest", desc: "Non processed music"}
param_usage_include_ports: true
param_ports:
  - {external_port: "8337", internal_port: "8337", port_desc: "Application WebUI"}
app_setup_block_enabled: true
app_setup_block: |
  Image: `ghcr.io/bgarber42/beets`

  Edit the config file in /config

  To edit the config from within the container use `beet config -e`

  For a command prompt as user abc `docker exec -it -u abc beets bash`

  See [Beets](https://beets.io/) for more info.

  Contains [beets-extrafiles](https://github.com/Holzhaus/beets-extrafiles) and [beetcamp](https://github.com/snejus/beetcamp).

  Hand-maintained README lives in README.md for this fork (LinuxServer README generator is not used).
# changelog
changelogs:
  - {date: "05.09.26:", desc: "Fork rewrite: GHCR publish from BGarber42/beets, drop-in compose contract, multi-arch Actions builds with layer caching."}
